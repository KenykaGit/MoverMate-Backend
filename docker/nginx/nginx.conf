# Edge reverse proxy in front of the api (docs/adr/0006). The only public entry point.
# HTTP only: TLS, if needed, is terminated by an external load balancer (then enable
# real_ip below so that the client address survives).
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    charset utf-8;
    default_type application/json;

    # Docker's embedded DNS. The upstream is resolved per request (proxy_pass with a
    # variable): after `docker compose up -d api` recreates the container with a new
    # IP, nginx follows it instead of returning 502 until restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Keep the caller's X-Request-ID, or generate one. The api echoes and logs it,
    # so one id links the nginx line, the api lines and the client's error body.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format json escape=json
        '{"time":"$time_iso8601","request_id":"$req_id","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_status":"$upstream_status","upstream_response_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # Behind a cloud load balancer that terminates TLS, trust only its address:
    # set_real_ip_from <lb-cidr>;
    # real_ip_header X-Forwarded-For;

    # The frontend runs in a separate compose project and publishes :3000 on the host.
    # host.docker.internal comes from `extra_hosts: host-gateway` of the nginx service and is
    # resolved once at start (the api upstream is resolved per request instead).
    upstream frontend {
        server host.docker.internal:3000;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # Proxy settings shared by the api and the frontend locations.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite, never append: a client cannot spoof its IP to dodge the rate limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $req_id;

        proxy_connect_timeout 2s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        # No retries: POST is not idempotent unless the client sent Idempotency-Key.
        proxy_next_upstream off;

        # Scraped from inside the network (api:8000/metrics), never exposed publicly.
        location = /metrics {
            add_header X-Request-ID $req_id always;
            return 404 '{"error":{"code":"not_found","message":"Not Found","details":[],"request_id":"$req_id"}}';
        }

        # Everything the backend serves. The rest of the paths belongs to the frontend, so a
        # new top-level api route (not under /api) has to be added to this list.
        location ~ ^/(api|health|docs|redoc|openapi\.json)(/|$) {
            set $upstream http://api:8000;
            proxy_pass $upstream;
        }

        # The web frontend, published by its own compose project on the host's :3000.
        location / {
            proxy_pass http://frontend;
        }

        # Errors produced by nginx itself (api down, timeout) use the API error contract.
        # Responses of the api (e.g. 503 from /health/ready) pass through unchanged.
        error_page 502 503 504 = @upstream_unavailable;
        location @upstream_unavailable {
            add_header Retry-After 5 always;
            add_header X-Request-ID $req_id always;
            return 503 '{"error":{"code":"service_unavailable","message":"Service is temporarily unavailable","details":[],"request_id":"$req_id"}}';
        }
    }
}
