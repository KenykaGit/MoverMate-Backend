# Production stack, used by the `deploy` CI job on the target server.
# Required in $DEPLOY_DIR/.env on the server (written by the deploy job from CI variables,
# never committed):
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, AUTH__SECRET_KEY (>= 32 random chars),
#   CORS_ORIGINS, DOMAIN (public name for the TLS certificate), optionally CERTBOT_EMAIL,
#   RATE_LIMIT__API_PER_MINUTE, RATE_LIMIT__AUTH_PER_MINUTE, RATE_LIMIT__SCAN_PER_MINUTE,
#   PUSH__VAPID_SUBJECT, LLM__API_KEY (photo scanning), LLM__SCAN_MODEL,
#   SAGE__API_KEY and SAGE__GROUP (log shipping, the `vector` service).
# Provided by the deploy job: IMAGE (registry path), IMAGE_TAG (git short sha).
# The deploy job also copies docker/nginx/, docker/certbot/ and docker/vector/ next to this file.

# Containers with this label have their stdout/stderr shipped to Sage by `vector` (ADR 0017).
x-sage-logs: &sage-logs
  sage.logs: "true"

x-app: &app
  image: ${IMAGE:?IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}
  labels: *sage-logs
  environment: &app-environment
    ENV: prod
    APP_VERSION: ${IMAGE_TAG}
    LOG_JSON: "true"
    CORS_ORIGINS: ${CORS_ORIGINS:-[]}
    DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
    REDIS__URL: redis://redis:6379/0
    AUTH__SECRET_KEY: ${AUTH__SECRET_KEY:?AUTH__SECRET_KEY is required}
    RATE_LIMIT__API_PER_MINUTE: ${RATE_LIMIT__API_PER_MINUTE:-120}
    RATE_LIMIT__AUTH_PER_MINUTE: ${RATE_LIMIT__AUTH_PER_MINUTE:-10}
    RATE_LIMIT__SCAN_PER_MINUTE: ${RATE_LIMIT__SCAN_PER_MINUTE:-10}
    # Photo scanning through the LLM proxy; without a key it answers 503, the rest works.
    LLM__API_KEY: ${LLM__API_KEY:-}
    LLM__SCAN_MODEL: ${LLM__SCAN_MODEL:-openrouter/claude-haiku-5-5}
    # Safe only because api publishes no ports: nginx is the single way in.
    FORWARDED_ALLOW_IPS: "*"

services:
  db:
    image: postgres:18.6-alpine3.24
    # No sage.logs label: on a unique violation Postgres writes the key value (a username)
    # into DETAIL, and logins are not logged by policy (docs/observability.md).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      # PostgreSQL 18+ keeps a versioned PGDATA under this directory (pg_upgrade-friendly).
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # No published ports: reachable only from the compose network.

  # Valkey: the BSD-licensed fork of Redis, same protocol and client (ADR 0003).
  redis:
    image: valkey/valkey:9.1.2-alpine3.24
    labels: *sage-logs
    # Only auxiliary data lives here: evicting keys under memory pressure is fine, the
    # worker's wake-up messages included (the notifications table is the queue).
    command: ["valkey-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: the deploy job runs `docker compose run --rm migrate` before restarting api.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    profiles: ["migrate"]  # never started by a plain `up`

  api:
    <<: *app
    environment:
      <<: *app-environment
      PUSH__VAPID_KEY_FILE: /var/lib/app/vapid/private_key.pem
    # Shared with the worker: the api hands out the public half of the key.
    volumes:
      - vapid:/var/lib/app/vapid
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Sends due notifications (Web Push) from the notifications table; no ports.
  # Woken up through the Redis queue by `scheduler` (taskiq, ADR 0012).
  worker:
    <<: *app
    command: ["taskiq", "worker", "app.worker.entry:broker", "--no-configure-logging", "--workers", "1", "--wait-tasks-timeout", "30"]
    # Longer than --wait-tasks-timeout: Docker's default 10 s would cut the running task.
    stop_grace_period: 35s
    environment:
      <<: *app-environment
      PUSH__VAPID_KEY_FILE: /var/lib/app/vapid/private_key.pem
      # Contact for push services: by default the site itself.
      PUSH__VAPID_SUBJECT: ${PUSH__VAPID_SUBJECT:-https://${DOMAIN:?DOMAIN is required}}
    volumes:
      - vapid:/var/lib/app/vapid
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Touched on start and after every successful run (every 15 s): stale means no
      # deliveries, whether the worker, the scheduler, Redis or Postgres is the cause.
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/worker-heartbeat') > 60)"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  # Puts a wake-up message for the worker into Redis every 15 s. Exactly one is
  # enough; a second one would only cause empty runs.
  scheduler:
    <<: *app
    command: ["taskiq", "scheduler", "app.worker.entry:scheduler", "--no-configure-logging"]
    # The image's HEALTHCHECK probes the api's HTTP port; the scheduler has none. If
    # it dies, the container restarts; stalled deliveries show up in the worker's health.
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Let's Encrypt certificate for $DOMAIN via the webroot that nginx serves on :80 (ADR 0009):
  # a self-signed placeholder first, then issuance and a renewal check every 12 hours.
  certbot:
    image: certbot/certbot:v5.8.0
    labels: *sage-logs
    entrypoint: ["/bin/sh", "/opt/certbot.sh"]
    init: true  # sh as PID 1 would ignore SIGTERM during `sleep`
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
    volumes:
      - ./certbot/certbot.sh:/opt/certbot.sh:ro
      - letsencrypt:/etc/letsencrypt
      - acme-webroot:/var/www/certbot
      - tls:/tls
    healthcheck:
      test: ["CMD", "test", "-s", "/tls/fullchain.pem"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  nginx:
    image: nginx:1.30.5-alpine3.24
    labels: *sage-logs
    entrypoint: ["/bin/sh", "/etc/nginx/tls-entrypoint.sh"]
    ports: ["80:80", "443:443"]
    # Reaches the frontend published on the host (:3000), see docker/nginx/http.conf.
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/http.conf:/etc/nginx/http.conf:ro
      - ./nginx/routes.conf:/etc/nginx/routes.conf:ro
      - ./nginx/tls-entrypoint.sh:/etc/nginx/tls-entrypoint.sh:ro
      - acme-webroot:/var/www/certbot:ro
      - tls:/etc/nginx/tls:ro
    depends_on:
      api:
        condition: service_healthy
      certbot:
        condition: service_healthy
    healthcheck:
      # Over TLS, as clients see it; the placeholder certificate is not trusted, hence no check.
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://127.0.0.1/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Ships logs of the labelled containers to Sage Logs Collector (ADR 0017). Started by the
  # deploy job only when SAGE__API_KEY is set; its own log is not shipped (no label), see
  # `docker compose logs vector` for delivery errors. Nothing depends on it.
  vector:
    image: timberio/vector:0.58.0-alpine
    command: ["--config", "/etc/vector/vector.toml", "--dangerously-allow-env-var-interpolation"]
    environment:
      SAGE__API_KEY: ${SAGE__API_KEY:-}
      SAGE__GROUP: ${SAGE__GROUP:-hack-led-12}
      SAGE__ENV: prod
    volumes:
      - ./vector/vector.toml:/etc/vector/vector.toml:ro
      # Read-only bind, but the Docker API itself is not read-only: see ADR 0017.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vector-data:/var/lib/vector
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8686/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pg-data:
  letsencrypt:  # certbot account and certificates: keep it, re-issuing is rate-limited
  acme-webroot:
  tls:
  vector-data:  # Vector's checkpoints and buffers, safe to lose
  vapid:  # the VAPID key pair of the worker: losing it breaks every push subscription
